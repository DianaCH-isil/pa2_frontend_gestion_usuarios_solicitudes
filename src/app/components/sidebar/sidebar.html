<aside class="sidebar-container">
  <div class="sidebar-brand">
    <div class="brand-text">
      <h1 class="brand-title">GS Académico</h1>
      <span class="brand-subtitle">Isil</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let link of enlaces()"
      [routerLink]="link.ruta"
      routerLinkActive="active"
      class="nav-link"
      [title]="link.etiqueta"
    >
      <div class="nav-icon-wrapper">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ng-container *ngIf="link.icono === 'bandeja'">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </ng-container>
          <ng-container *ngIf="link.icono === 'mis'">
            <path d="M3 12a9 9 0 1 0 9-9"></path>
            <polyline points="3 4 3 9 8 9"></polyline>
          </ng-container>
          <ng-container *ngIf="link.icono === 'nueva'">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </ng-container>
          <ng-container *ngIf="link.icono === 'gestion'">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </ng-container>
          <ng-container *ngIf="link.icono === 'alumnos'">
            <path d="M8 6h13"></path>
            <path d="M8 12h13"></path>
            <path d="M8 18h13"></path>
            <path d="M3 6h.01"></path>
            <path d="M3 12h.01"></path>
            <path d="M3 18h.01"></path>
          </ng-container>
        </svg>
      </div>
      <span class="nav-label">{{ link.etiqueta }}</span>
    </a>
  </nav>
</aside>
