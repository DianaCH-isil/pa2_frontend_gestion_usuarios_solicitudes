<section class="login-section">
  <div class="login-card">
    <div class="login-brand">
      <h1 class="login-title">GS Académico</h1>
      <span class="login-subtitle">ISIL</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>
      <div class="form-group">
        <label for="correo" class="form-label">
          <span>CORREO INSTITUCIONAL</span>
        </label>
        <input
          id="correo"
          type="email"
          class="form-control"
          formControlName="correo"
          [class.has-error]="esInvalido('correo')"
          placeholder="usuario@isil.pe"
          autocomplete="username"
        />
        <div *ngIf="esInvalido('correo')" class="error-feedback">
          <span *ngIf="f['correo'].errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="f['correo'].errors?.['email']">Ingrese un correo válido.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <span>CONTRASEÑA</span>
        </label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          [class.has-error]="esInvalido('password')"
          placeholder="Mínimo 3 caracteres"
          autocomplete="current-password"
        />
        <div *ngIf="esInvalido('password')" class="error-feedback">
          <span *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</span>
        </div>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="loginForm.invalid || cargando()"
        title="Ingresar al sistema"
      >
        {{ cargando() ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

      <p *ngIf="mensajeError()" class="error-banner">⚠ {{ mensajeError() }}</p>
    </form>

    <div class="login-help">
      <p class="help-title">Cuentas de prueba (contraseña: 123)</p>
      <ul>
        <li><strong>Admin:</strong> admin@isil.pe</li>
        <li><strong>Personal:</strong> personal@isil.pe</li>
        <li><strong>Estudiante:</strong> valeria@isil.pe</li>
      </ul>
    </div>
  </div>
</section>
