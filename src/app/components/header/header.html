<header class="top-header">
  <div class="header-titles">
    <h2 class="portal-main-title">Portal de Solicitudes Académicas</h2>
  </div>

  <div class="user-profile-widget" *ngIf="user() as u">
    <div class="user-info">
      <span class="user-name">{{ u.nombre }}</span>
      <span class="user-role">{{ rol() }}</span>
    </div>
    <button
      type="button"
      class="logout-btn"
      (click)="cerrarSesion()"
      title="Cerrar sesión"
    >
      Cerrar sesión
    </button>
  </div>
</header>
